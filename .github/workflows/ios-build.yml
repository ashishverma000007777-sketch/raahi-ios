name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        id: select-xcode
        run: |
          echo "=== Discovering Installed Xcode Versions ==="
          ls -d /Applications/Xcode*.app || true

          # Discover and activate available Xcode (prefer Xcode 16.0 or 15.4)
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            SELECTED_XCODE="/Applications/Xcode_16.0.app"
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            SELECTED_XCODE="/Applications/Xcode_15.4.app"
          elif [ -d "/Applications/Xcode.app" ]; then
            SELECTED_XCODE="/Applications/Xcode.app"
          else
            SELECTED_XCODE=$(xcode-select -p)
          fi

          if [ -d "$SELECTED_XCODE" ]; then
            echo "Selecting: $SELECTED_XCODE"
            sudo xcode-select -s "$SELECTED_XCODE"
          fi

          echo "Active developer directory: $(xcode-select -p)"

      - name: Print Toolchain Versions
        run: |
          echo "=== Xcode Version ==="
          xcodebuild -version
          echo "=== Swift Version ==="
          swift --version
          echo "=== macOS Version ==="
          sw_vers

      - name: List Available Schemes
        run: |
          echo "=== Xcode Project Schemes ==="
          xcodebuild -list -project RaahiIOS.xcodeproj

      - name: Discover iOS Simulator Destination
        id: discover-dest
        run: |
          echo "=== Listing Available Simulator Runtimes and Devices ==="
          xcrun simctl list runtimes
          
          # Discover first available iOS simulator runtime and device UDID
          DEST_INFO=$(python3 -c '
          import json, subprocess, sys
          try:
              raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
              data = json.loads(raw)
              devices_map = data.get("devices", {})
              for runtime_id, devices in devices_map.items():
                  if "iOS" in runtime_id:
                      for d in devices:
                          if d.get("isAvailable", False):
                              print(f"{d[\"udid\"]}|{d.get(\"name\")}|{runtime_id}")
                              sys.exit(0)
          except Exception as e:
              sys.stderr.write(f"Error discovering simulator: {e}\n")
          sys.exit(1)
          ' || true)

          if [ -n "$DEST_INFO" ]; then
            UDID=$(echo "$DEST_INFO" | cut -d'|' -f1)
            NAME=$(echo "$DEST_INFO" | cut -d'|' -f2)
            RUNTIME=$(echo "$DEST_INFO" | cut -d'|' -f3)
            echo "Found available iOS simulator: $NAME ($UDID) on $RUNTIME"
            echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
            echo "DESTINATION=id=$UDID" >> "$GITHUB_ENV"

            # Boot simulator ahead of time to accelerate test execution
            echo "Booting simulator $UDID..."
            xcrun simctl boot "$UDID" 2>/dev/null || true
          else
            echo "No available concrete iOS simulator found; falling back to generic platform"
            echo "DESTINATION=generic/platform=iOS Simulator" >> "$GITHUB_ENV"
          fi

      - name: Build RaahiIOS for iOS Simulator
        id: build-app
        run: |
          mkdir -p logs
          echo "=== Building RaahiIOS Target (destination: $DESTINATION) ==="
          set -o pipefail
          xcodebuild clean build \
            -project RaahiIOS.xcodeproj \
            -scheme RaahiIOS \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | tee logs/build.log

      - name: Run Unit Tests on iOS Simulator
        id: run-tests
        run: |
          mkdir -p logs
          echo "=== Running 16 Unit Tests (scheme: RaahiIOS, destination: $DESTINATION) ==="
          set -o pipefail
          xcodebuild test \
            -project RaahiIOS.xcodeproj \
            -scheme RaahiIOS \
            -destination "$DESTINATION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | tee logs/test.log

      - name: Upload Build and Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: logs/
          retention-days: 7
